services:
  - type: web
    name: federwerk
    runtime: python
    plan: free
    healthCheckPath: /
    buildCommand: pip install -r requirements.txt
    # One worker keeps the in-memory drawing sessions in a single process; threads share that memory.
    startCommand: gunicorn --worker-class gthread --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
